name: Android app (build, scan, publish)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml', 'site/icon-512.png']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: 1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor and create the Android project
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: App icons and version
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick librsvg2-bin > /dev/null
          RES=app/android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}; px=${d##*:}
            convert site/icon-512.png -resize ${px}x${px} $RES/mipmap-$name/ic_launcher.png
            convert site/icon-512.png -resize ${px}x${px} $RES/mipmap-$name/ic_launcher_round.png
            mkdir -p $RES/drawable-$name
            rsvg-convert -w $((px/2)) -h $((px/2)) app/notification-icon.svg -o $RES/drawable-$name/ic_stat_tv.png
          done
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" app/android/app/build.gradle
          grep -E "versionCode|versionName" app/android/app/build.gradle

      - name: Build APK
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            ./gradlew --no-daemon assembleRelease
            BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
            $BT/zipalign -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out ../../web-tv-hub.apk aligned.apk
            rm -f release.jks
            echo "SIGNING=release" >> $GITHUB_ENV
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../web-tv-hub.apk
            echo "SIGNING=debug" >> $GITHUB_ENV
          fi
          ls -la ../../web-tv-hub.apk

      - name: Malware scan (ClamAV) and checksum
        run: |
          sudo apt-get install -y -qq clamav > /dev/null
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam --quiet || sudo freshclam
          clamscan --version | tee clamav-version.txt
          set +e
          clamscan --no-summary --infected web-tv-hub.apk > clamscan.txt; RC=$?
          set -e
          if [ $RC -eq 1 ]; then echo "::error::ClamAV found malware"; cat clamscan.txt; exit 1; fi
          if [ $RC -gt 1 ]; then echo "::error::ClamAV scan failed"; exit 1; fi
          SHA=$(sha256sum web-tv-hub.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s web-tv-hub.apk)
          echo "SHA=$SHA" >> $GITHUB_ENV
          export SHA SIZE
          node -e '
            const fs=require("fs");
            fs.writeFileSync("scan.json", JSON.stringify({
              version: process.env.VERSION, sha256: process.env.SHA, size: +process.env.SIZE, signing: process.env.SIGNING,
              builtAt: new Date().toISOString(), commit: process.env.GITHUB_SHA,
              workflowRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              clamav: { engine: fs.readFileSync("clamav-version.txt","utf8").trim(), result: "clean", scannedAt: new Date().toISOString() },
              virustotal: { url: "https://www.virustotal.com/gui/file/" + process.env.SHA, uploaded: false }
            }, null, 2));'
          cat scan.json

      - name: Upload to VirusTotal (optional)
        env:
          VT: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          if [ -z "$VT" ]; then echo "No VIRUSTOTAL_API_KEY secret; skipping upload."; exit 0; fi
          curl -sf --request POST --url https://www.virustotal.com/api/v3/files --header "x-apikey: $VT" --form file=@web-tv-hub.apk > vt.json && \
            node -e 'const fs=require("fs");const s=JSON.parse(fs.readFileSync("scan.json"));s.virustotal.uploaded=true;fs.writeFileSync("scan.json",JSON.stringify(s,null,2));' || echo "VirusTotal upload failed"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v$VERSION"
          NOTES="Web TV Hub for Android $VERSION

          - Malware scan: ClamAV — clean (see scan.json)
          - SHA-256: \`$SHA\`
          - Signing: $SIGNING
          - Built from commit $GITHUB_SHA by GitHub Actions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Check it yourself: https://www.virustotal.com/gui/file/$SHA"
          gh release create "$TAG" web-tv-hub.apk scan.json --title "Android app $VERSION" --notes "$NOTES" --latest=false
          # refresh the site so the download page shows this build right away
          gh workflow run refresh-and-deploy.yml --ref main || echo 'site refresh not triggered'
