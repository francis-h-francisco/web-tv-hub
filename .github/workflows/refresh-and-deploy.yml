name: Refresh channels and deploy

on:
  push:
    branches: [main]
  schedule:
    # every 6 hours (minute 17 avoids the top-of-hour rush)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # to publish the built site to the cf-pages branch (Cloudflare Pages deploys it)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pipeline dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Restore cast lookup cache
        uses: actions/cache@v6
        with:
          path: .cache
          key: people-${{ github.run_id }}
          restore-keys: people-
      - name: Fetch, curate, health-check and build guide data
        run: node pipeline/build.mjs --out site/data
      - name: Latest Android app release (served from our own site, so the download page needs no GitHub API call)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '[.[] | select((.tag_name|startswith("app-v")) and (.draft|not))][0] // {} | {tag_name, published_at, body, assets: [(.assets // [])[] | {name, size, browser_download_url}]}' > site/data/app-release.json || echo '{}' > site/data/app-release.json
          head -c 300 site/data/app-release.json; echo
      - name: Sanity check output
        run: |
          node -e "const d=require('./site/data/channels.json'); if (d.channels.length < 100) { console.error('Only', d.channels.length, 'channels - refusing to deploy'); process.exit(1) } console.log(d.channels.length, 'channels')"
          cat site/data/report.json
      - name: Publish to the cf-pages branch (Cloudflare Pages)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/cf && mkdir -p /tmp/cf/public
          cp -r site/. /tmp/cf/public/
          cp -r cloudflare/functions cloudflare/wrangler.toml /tmp/cf/
          # share pages point at the domain they're served from
          find /tmp/cf/public/s -name '*.html' -exec sed -i 's#https://francis-h-francisco.github.io/web-tv-hub/#https://webtv-hub.pages.dev/#g' {} +
          printf '/data/*\n  Cache-Control: no-cache\n/s/img/*\n  Cache-Control: public, max-age=86400\n/vendor/*\n  Cache-Control: public, max-age=604800\n' > /tmp/cf/public/_headers
          cd /tmp/cf && git init -q -b cf-pages && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Site build ${GITHUB_SHA::7} ($(date -u +%FT%TZ))"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cf-pages
          echo "Published $(git ls-files | wc -l) files to cf-pages"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
