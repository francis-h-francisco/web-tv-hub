<title>Web TV Hub — Free curated live TV</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-dot"></span><span>Web TV Hub</span><button class="kidsbadge" data-action="kids">🧒 Kids mode</button></div>
  <nav class="topnav" aria-label="Main">
    <button class="navbtn" data-focus data-action="search">Search</button>
    <button class="navbtn" data-focus data-action="mytv">My TV</button>
    <button class="navbtn" data-focus data-action="profile">Profile</button>
    <button class="navbtn" data-focus data-action="remote">📱 Remote</button>
    <button class="navbtn" data-focus data-action="more">More</button>
  </nav>
  <div class="clock" id="clock"></div>
  <button class="castbtn" data-action="cast" id="castTop" aria-label="Cast to a TV" hidden>📡</button>
  <button class="tvbtn" data-action="remote" aria-label="Use this phone as a TV remote">📺 Control TV</button>
</header>

<div class="layout">
  <section class="watch" aria-label="Now watching">
    <div class="player" id="player" data-focus tabindex="0" aria-label="Video player. Press OK for full screen">
      <video id="video" playsinline muted autoplay></video>
      <div class="player-msg" id="playerMsg"></div>
      <button class="unmute" id="unmute" hidden>🔇 <span class="on-touch">Tap for sound</span><span class="on-tv">Tap or press OK for sound</span></button>
      <div class="castbar" id="castbar" hidden>
        <div class="cb-dev" id="cbDev">📡 Casting</div>
        <div class="cb-what" id="cbWhat"></div>
        <div class="cb-row">
          <button class="pbtn" data-cb="prev" aria-label="Previous channel">⏮</button>
          <button class="pbtn" data-cb="pause" id="cbPause" aria-label="Pause">⏸</button>
          <button class="pbtn" data-cb="next" aria-label="Next channel">⏭</button>
          <button class="pbtn" data-cb="voldown" aria-label="Volume down">🔉</button>
          <button class="pbtn" data-cb="mute" id="cbMute" aria-label="Mute">🔇</button>
          <button class="pbtn" data-cb="volup" aria-label="Volume up">🔊</button>
        </div>
        <button class="btn small" data-cb="stop">Stop casting</button>
      </div>
      <div class="pctl" id="pctl">
        <button class="pbtn" data-focus data-action="pause" id="pauseBtn" aria-label="Pause">⏸</button>
        <button class="pbtn" data-focus data-action="mute" id="muteBtn" aria-label="Mute">🔊</button>
        <button class="pbtn" data-focus data-action="cast" id="castBtn" aria-label="Cast to TV" hidden>📡</button>
        <button class="pbtn" data-focus data-action="pip" id="pipBtn" aria-label="Picture in picture" hidden>⧉</button>
        <button class="pbtn" data-focus data-action="sleep" id="sleepBtn" aria-label="Sleep timer">🌙</button>
      </div>
    </div>
    <div class="nowcard">
      <div class="ch-line">
        <img id="nowLogo" class="ch-logo" alt="" hidden>
        <div class="ch-text">
          <div class="ch-name" id="nowName">Loading channels…</div>
          <div class="ch-meta" id="nowMeta"></div>
        </div>
        <div class="ch-actions">
          <button class="iconbtn" data-focus data-action="fav" id="favBtn" aria-label="Favorite">☆</button>
          <button class="iconbtn" data-focus data-action="sharech" aria-label="Share this channel">↗</button>
          <button class="iconbtn" data-focus data-action="fullscreen" aria-label="Full screen">⛶</button>
        </div>
      </div>
      <div class="timeline" id="timeline" aria-label="Schedule"></div>
    </div>
  </section>

  <section class="browse" aria-label="Channel guide">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="guide" id="guide"></div>
    <div class="peek" id="peek"></div>
  </section>
</div>

<nav class="bottombar" aria-label="App">
  <button data-action="home" class="on"><span>📺</span>Watch</button>
  <button data-action="search"><span>🔍</span>Search</button>
  <button data-action="mytv"><span>⭐</span>My TV</button>
  <button data-action="profile"><span>👤</span>Profile</button>
  <button data-action="more"><span>☰</span>More</button>
</nav>

<div class="overlay" id="overlay" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
