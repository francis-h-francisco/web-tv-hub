# Cloudflare Pages project config. The "Refresh channels and deploy" workflow publishes the built
# site to the `cf-pages` branch as public/ + functions/ + this file; Pages deploys that branch.
name = "webtv-hub"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "webtv-db"
database_id = "5a02356d-7787-4cba-8b7b-103b4542f506"
