<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link ended — Web TV Hub</title><meta name="robots" content="noindex"><meta name="theme-color" content="#0b0d12">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d12;color:#eef1f6;font-family:system-ui,sans-serif;text-align:center}
.c{max-width:28rem;margin:1.5rem}p{color:#98a2b3;line-height:1.5}a{display:inline-block;margin-top:.8rem;padding:.9rem 1.4rem;border-radius:.7rem;background:#ffb347;color:#1a1206;font-weight:700;text-decoration:none}</style>
</head><body><div class="c"><h1>That show has ended</h1><p id="m">Shared show links expire once the show is over. The channel is probably still on, though.</p><a id="go" href="./">See what's on now</a></div>
<script>
// /web-tv-hub/s/<channel>/<start>.html  ->  that channel's page (if it still exists) or the app
// works on GitHub Pages (/web-tv-hub/...) and on Cloudflare Pages (/...)
var base = location.pathname.indexOf('/web-tv-hub/') === 0 ? '/web-tv-hub/' : '/';
var go = document.getElementById('go'); go.href = base;
var m = location.pathname.match(/\/s\/([^/]+)\/\d+\.html$/);
if (m) { go.href = base + '?ch=' + encodeURIComponent(m[1]); go.textContent = '▶ Watch the channel now'; }
</script></body></html>
